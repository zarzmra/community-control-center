services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: community_control_center
      POSTGRES_USER: ccc
      POSTGRES_PASSWORD: ccc_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccc -d community_control_center"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
